name: Release APK

# 自动化发布：推送 v* 形式的 tag（如 v1.0.4）时自动构建 release APK 并发布到 GitHub Releases。
# 也支持手动触发（仅构建不发布），验收构建是否可用。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle 依赖缓存：依赖清单不变时命中缓存，免除每次构建重新下载全部依赖
          cache: 'gradle'

      # 签名说明：release 构建优先使用仓库 Secret DEBUG_KEYSTORE_BASE64
      # （固定密钥的 base64）签名；构建脚本通过 KGAC_KEYSTORE_PATH 环境变量
      # 显式引用，不再写入/依赖 ~/.android/debug.keystore 的隐式查找路径。
      # 构建后自动校验产物签名指纹，不一致直接失败，杜绝签名漂移的版本流出。
      # 安全加固（2026-11-06）：密钥库密码由 Actions Secret KGAC_KEYSTORE_PASS
      # 注入；若已配置密钥库但缺少密码 Secret，则直接失败（fail-fast），
      # 绝不静默回落默认密码。未配置密钥库 Secret 时回退 CI 临时 debug 签名。
      - name: Restore release keystore (optional)
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KGAC_KEYSTORE_PASS }}
        run: |
          echo "env: ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-unset} ANDROID_USER_HOME=${ANDROID_USER_HOME:-unset}"
          if [ -n "$KEYSTORE" ]; then
            if [ -z "$KEYSTORE_PASS" ]; then
              echo "::error::DEBUG_KEYSTORE_BASE64 is set but KGAC_KEYSTORE_PASS secret is missing; refusing to build (no passwordless fallback)"
              exit 1
            fi
            mkdir -p "$HOME/kgac-signing"
            printf '%s' "$KEYSTORE" | base64 -d > "$HOME/kgac-signing/release.keystore"
            echo "KGAC_KEYSTORE_PATH=$HOME/kgac-signing/release.keystore" >> "$GITHUB_ENV"
            echo "KGAC_KEYSTORE_STORE_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KGAC_KEYSTORE_KEY_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "fixed release keystore restored (${#KEYSTORE} chars)"
          else
            echo "DEBUG_KEYSTORE_BASE64 secret not set; build falls back to ephemeral debug signing"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signing certificate
        run: |
          if [ -z "$KGAC_KEYSTORE_PATH" ]; then
            echo "no fixed keystore configured; skip certificate verification"
            exit 0
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
                 | grep -m1 'SHA-256 digest' | grep -oE '[0-9a-fA-F]{64}')
          CERT=$(echo "$CERT" | tr 'A-F' 'a-f')
          echo "APK signer cert sha256: $CERT"
          EXPECTED="057acf50702929c75c1ef8ab244fe6cd6f8f3c78d3499f4d683b5ddd51b122ca"
          if [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::signing certificate mismatch: got $CERT, expected $EXPECTED"
            exit 1
          fi
          echo "signing certificate verified OK"

      - name: Rename APK (KGAC_vX.Y.Z.apk)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "KGAC_v${TAG}.apk"
          ls -lh KGAC_v*.apk

      # 仅 tag 触发时发布；若同名 Release 已存在则将 APK 附加到该 Release
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: KGAC_v*.apk

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KGAC-release-apk
          path: KGAC_v*.apk