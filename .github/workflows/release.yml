name: Release APK

# 自动化发布：推送 v* 形式的 tag（如 v1.0.8）时自动构建 release APK 并发布到 GitHub Releases。
# 也支持手动触发（仅构建并上传 artifact，用于验收构建是否可用）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      # 签名：release 构建优先使用仓库 Secret DEBUG_KEYSTORE_BASE64（固定密钥 base64）。
      # 构建后自动校验产物签名证书指纹，不一致直接失败，杜绝签名漂移的版本流出。
      # 未配置 Secret 时回退 CI 临时 debug 签名（各版本间不可覆盖升级）。
      # 密码只经 Secret 运行时注入，源码与日志中均无明文（2026-11-06 安全审计整改，与 Grocool 统一模式）。
      - name: Restore release keystore (optional)
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KGAC_KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/kgac-signing"
            printf '%s' "$KEYSTORE" | base64 -d > "$HOME/kgac-signing/release.keystore"
            echo "KGAC_KEYSTORE_PATH=$HOME/kgac-signing/release.keystore" >> "$GITHUB_ENV"
            if [ -z "$KS_PASS" ]; then
              echo "::error::KGAC_KEYSTORE_PASS secret not set; fail-fast"
              exit 1
            fi
            printf 'KGAC_KEYSTORE_STORE_PASS=%s\n' "$KS_PASS" >> "$GITHUB_ENV"
            printf 'KGAC_KEYSTORE_KEY_PASS=%s\n' "$KS_PASS" >> "$GITHUB_ENV"
            printf 'KGAC_KEYSTORE_ALIAS=%s\n' "androiddebugkey" >> "$GITHUB_ENV"
            echo "fixed release keystore restored (${#KEYSTORE} chars)"
          else
            echo "DEBUG_KEYSTORE_BASE64 secret not set; build falls back to ephemeral debug signing"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signing certificate
        run: |
          if [ -z "$KGAC_KEYSTORE_PATH" ]; then
            echo "no fixed keystore configured; skip certificate verification"
            exit 0
          fi
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
                 | grep -m1 'SHA-256 digest' | grep -oE '[0-9a-fA-F]{64}')
          CERT=$(echo "$CERT" | tr 'A-F' 'a-f')
          echo "APK signer cert sha256: $CERT"
          EXPECTED="057acf50702929c75c1ef8ab244fe6cd6f8f3c78d3499f4d683b5ddd51b122ca"
          if [ "$CERT" != "$EXPECTED" ]; then
            echo "::error::signing certificate mismatch: got $CERT, expected $EXPECTED"
            exit 1
          fi
          echo "signing certificate verified OK"

      - name: Rename APK (KGAC-vX.Y.Z.apk)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "KGAC-v${TAG}.apk"
          ls -lh KGAC-v*.apk

      # 仅 tag 触发时发布到 GitHub Release
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: KGAC-v*.apk

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KGAC-release-apk
          path: KGAC-v*.apk