name: Release APK

# 自动化发布：推送 v* 形式的 tag（如 v1.0.4）时自动构建 release APK 并发布到 GitHub Releases。
# 也支持手动触发（仅构建不发布），验收构建是否可用。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 签名说明：本项目 release 使用 debug 签名（个人使用场景，见 app/build.gradle.kts）。
      # 可选：在仓库 Settings → Secrets and variables → Actions 添加 secret
      #   DEBUG_KEYSTORE_BASE64 = 本机 debug.keystore (Windows: %USERPROFILE%\.android\debug.keystore)
      # 的 base64 文本（命令：certutil -encode debug.keystore enc.txt 后取内容去头尾行，或
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes("...debug.keystore"))）。
      # 配置后 CI 产物与本机历史版本签名一致，App 内更新可直接覆盖安装；
      # 未配置时 CI 会自动生成新的 debug 签名（首次需卸载重装并重新登录账号）。
      - name: Restore debug keystore (optional)
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          PROBE: ${{ secrets.PROBE_CHECK }}
        run: |
          # 诊断输出：仅打印长度，不泄露内容
          echo "probe_len=${#PROBE} keystore_len=${#KEYSTORE}"
          if [ -n "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            rm -f "$HOME/.android/debug.keystore"
            printf '%s' "$KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
            echo "debug.keystore restored from secret"
          else
            echo "DEBUG_KEYSTORE_BASE64 secret not set; gradle will generate a fresh debug keystore"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --info --stacktrace

      - name: Rename APK (KGAC_vX.Y.Z.apk)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "KGAC_v${TAG}.apk"
          ls -lh KGAC_v*.apk

      # 仅 tag 触发时发布；若同名 Release 已存在则将 APK 附加到该 Release
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: KGAC_v*.apk

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: KGAC-release-apk
          path: KGAC_v*.apk
